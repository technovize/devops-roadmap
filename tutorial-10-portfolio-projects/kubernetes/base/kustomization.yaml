apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - network-policy.yaml
  - service-monitor.yaml

commonLabels:
  app: django-gitops-app
  managed-by: kustomize

# Image will be updated by ArgoCD Image Updater
images:
  - name: ghcr.io/myorg/django-gitops-app
    newTag: latest

---
# kubernetes/overlays/production/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

bases:
  - ../../base

patches:
  - path: patches/deployment-production.yaml
  - path: patches/hpa-production.yaml

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
      - ALLOWED_HOSTS=myapp.com,api.myapp.com

---
# kubernetes/overlays/production/patches/deployment-production.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-gitops-app
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: PROJECT_NAME
              value: myapp
