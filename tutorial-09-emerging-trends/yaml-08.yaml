# VirtualService — control routing, retries, and traffic shifting
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payment-service
  namespace: production
spec:
  hosts:
    - payment-service
  http:
    - match:
        - headers:
            x-canary-user:
              exact: "true"
      route:
        - destination:
            host: payment-service
            subset: v2
          weight: 100

    - route:
        - destination:
            host: payment-service
            subset: v1
          weight: 90
        - destination:
            host: payment-service
            subset: v2
          weight: 10

      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: "5xx,reset,connect-failure"

      timeout: 10s

      fault:                   # Inject faults for chaos engineering
        delay:
          percentage:
            value: 0.1         # Add 5s delay to 0.1% of requests (test resilience)
          fixedDelay: 5s

---
# DestinationRule — define subsets and mTLS policy
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: payment-service
  namespace: production
spec:
  host: payment-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL      # Enforce mTLS for all traffic to this service

    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
      tcp:
        maxConnections: 100

    outlierDetection:          # Circuit breaker
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

  subsets:
    - name: v1
      labels:
        version: v1.2.0
    - name: v2
      labels:
        version: v1.3.0
