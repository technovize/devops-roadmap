apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app-alerts
  namespace: monitoring
spec:
  groups:

    # -- Availability ------------------------------------------------------
    - name: availability
      rules:

        - alert: ServiceDown
          expr: up{job="my-app"} == 0
          for: 1m          # Must be true for 1 minute before firing
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Service {{ $labels.instance }} is down"
            description: >
              {{ $labels.instance }} has been unreachable for more than 1 minute.
              Check pod status: kubectl get pods -n production -l app=my-app
            runbook_url: "https://wiki.myapp.com/runbooks/service-down"

        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(http_requests_total[5m]))
            ) * 100 > 5
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "High error rate: {{ $value | printf \"%.2f\" }}%"
            description: >
              Error rate has exceeded 5% for 5 minutes.
              Current value: {{ $value | printf "%.2f" }}%

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le, endpoint) (
                rate(http_request_duration_seconds_bucket[5m])
              )
            ) > 2.0
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "High p95 latency on {{ $labels.endpoint }}: {{ $value | printf \"%.2f\" }}s"
            description: >
              p95 latency on {{ $labels.endpoint }} has exceeded 2 seconds for 5 minutes.

    # -- Infrastructure ----------------------------------------------------
    - name: infrastructure
      rules:

        - alert: HighCPU
          expr: |
            100 - (avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            ) * 100) > 85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High CPU on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}%"

        - alert: HighMemory
          expr: |
            100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Memory usage critical on {{ $labels.instance }}: {{ $value | printf \"%.1f\" }}%"

        - alert: DiskSpaceLow
          expr: |
            100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"}
              / node_filesystem_size_bytes)) > 80
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Disk usage at {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 0m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: >
              Pod {{ $labels.pod }} has restarted {{ $value | printf "%.0f" }}
              times in the last hour.
