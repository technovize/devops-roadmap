apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      resource:
        attributes:
          - key: cluster.name
            value: "my-cluster-production"
            action: insert

      # Filter out health check traces (reduce noise)
      filter/health:
        spans:
          exclude:
            match_type: strict
            attributes:
              - key: http.target
                value: "/health"

    exporters:
      # Send traces to Tempo (Grafana's trace store)
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true

      # Send metrics to Prometheus remote write
      prometheusremotewrite:
        endpoint: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write

    service:
      pipelines:
        traces:
          receivers:  [otlp]
          processors: [batch, resource, filter/health]
          exporters:  [otlp/tempo]

        metrics:
          receivers:  [otlp]
          processors: [batch, resource]
          exporters:  [prometheusremotewrite]
