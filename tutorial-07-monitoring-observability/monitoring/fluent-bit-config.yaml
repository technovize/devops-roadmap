apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On          # Merge JSON log fields into the record
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On          # Respect pod annotation to exclude logs

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log ^$                  # Skip empty log lines

    [OUTPUT]
        Name            es
        Match           kube.*
        Host            elasticsearch.monitoring.svc.cluster.local
        Port            9200
        Index           kubernetes-logs
        Type            _doc
        Logstash_Format On
        Logstash_Prefix kubernetes
        Retry_Limit     5
        tls             Off
