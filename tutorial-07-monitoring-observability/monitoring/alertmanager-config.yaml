global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_API_URL}"

# -- Routing Tree --------------------------------------------------------------
route:
  receiver: default-receiver
  group_by: [alertname, cluster, namespace]
  group_wait:      30s    # Wait before sending first notification (collects related alerts)
  group_interval:  5m     # Wait before sending new notification for same group
  repeat_interval: 4h     # Re-send if alert is still firing after this interval

  routes:

    # Critical alerts -> PagerDuty (wakes someone up)
    - match:
        severity: critical
      receiver: pagerduty-critical
      continue: true       # Also send to the next matching route

    # Critical alerts -> Slack #incidents
    - match:
        severity: critical
      receiver: slack-incidents

    # Warning alerts -> Slack #alerts-warning
    - match:
        severity: warning
      receiver: slack-warnings

    # Database team gets database alerts
    - match:
        team: database
      receiver: slack-database-team

# -- Receivers -----------------------------------------------------------------
receivers:

  - name: default-receiver
    slack_configs:
      - channel: "#alerts-default"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: pagerduty-critical
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"

  - name: slack-incidents
    slack_configs:
      - channel: "#incidents"
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}:fire:{{ else }}(yes){{ end }}
          {{ .GroupLabels.alertname }}
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Severity:* {{ .CommonLabels.severity | toUpper }}
          {{ range .Alerts }}
          *Details:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        actions:
          - type: button
            text: "View Dashboard"
            url: "https://grafana.myapp.com/d/overview"
          - type: button
            text: "View Runbook"
            url: "{{ (index .Alerts 0).Annotations.runbook_url }}"

  - name: slack-warnings
    slack_configs:
      - channel: "#alerts-warning"
        send_resolved: true
        title: "[!] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}"

  - name: slack-database-team
    slack_configs:
      - channel: "#team-database"
        send_resolved: true
        title: ":file_cabinet: {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}"

# -- Inhibition Rules ----------------------------------------------------------
# Suppress warnings when a critical alert is already firing for the same target
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
