# Alert rule
groups:
  - name: flask-app
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="flask-app", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="flask-app"}[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate: {{ $value | printf \"%.2f\" }}%"
          description: "Error rate has exceeded 5% for 2 minutes."
