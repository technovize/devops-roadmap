apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  namespace: production
spec:
  selector:
    app: my-app               # Route traffic to Pods with this label

  ports:
    - protocol: TCP
      port: 80                # Port the Service listens on
      targetPort: 8000        # Port the container listens on

  type: ClusterIP             # Internal-only (use LoadBalancer for external access)
