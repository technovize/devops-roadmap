apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: production
  labels:
    app: my-app
spec:
  replicas: 3                   # Run 3 identical Pods at all times

  selector:
    matchLabels:
      app: my-app               # Manage Pods with this label

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1               # Allow 1 extra Pod during update
      maxUnavailable: 0         # Never go below 3 running Pods

  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: myregistry/my-app:1.2.0
          ports:
            - containerPort: 8000

          # Environment variables from a ConfigMap and Secret
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.production"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: my-app-config
                  key: db_host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-secrets
                  key: db_password

          # Resource requests and limits
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # Liveness probe — restart the container if this fails
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # Readiness probe — only route traffic when this passes
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
