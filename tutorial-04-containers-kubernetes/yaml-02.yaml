livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 30  # Wait 30s before first check
  periodSeconds: 15         # Check every 15 seconds
  failureThreshold: 3       # Kill and restart after 3 consecutive failures

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3       # Remove from load balancer after 3 failures

startupProbe:
  httpGet:
    path: /health/live
    port: 8000
  failureThreshold: 30      # Allow up to 5 minutes (30 * 10s) for startup
  periodSeconds: 10
