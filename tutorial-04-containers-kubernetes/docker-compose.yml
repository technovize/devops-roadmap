version: "3.9"

services:

  # -- Web Application ----------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: my-django-app:local
    container_name: myapp_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload
    volumes:
      - .:/app                        # Mount source code for hot reload in dev
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY}      # Read from .env file
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/myapp
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy    # Wait for DB health check before starting
      redis:
        condition: service_started
    restart: unless-stopped

  # -- Database -----------------------------------------
  db:
    image: postgres:16-alpine
    container_name: myapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=myapp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"                   # Expose for local DB tools (e.g., pgAdmin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -- Cache ---------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: myapp_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # -- Background Worker ---------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/myapp
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # -- Reverse Proxy -------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: myapp_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:
