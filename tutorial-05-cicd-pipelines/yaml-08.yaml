# .gitlab-ci.yml — write this from scratch:
# Requirements:
# 1. Three stages: validate, test, deploy
# 2. validate stage: run flake8 and bandit in parallel
# 3. test stage: run pytest with postgres service
# 4. deploy stage: manual trigger, only on main branch
# 5. Pass test reports as artifacts

# Answer key:
stages:
  - validate
  - test
  - deploy

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: testpassword

cache:
  key:
    files: [requirements.txt]
  paths:
    - .pip-cache/

.python-base: &python
  image: python:3.12-slim
  before_script:
    - pip install --cache-dir .pip-cache -r requirements.txt -q

lint:flake8:
  <<: *python
  stage: validate
  script:
    - flake8 app/ --max-line-length=120

lint:security:
  <<: *python
  stage: validate
  script:
    - pip install bandit -q
    - bandit -r app/ -ll -f json -o bandit-report.json
  artifacts:
    paths: [bandit-report.json]
    when: always
    expire_in: 1 week

test:unit:
  <<: *python
  stage: test
  services:
    - postgres:16-alpine
  script:
    - pip install -r requirements-dev.txt -q
    - pytest tests/ --cov=app --cov-report=xml --junitxml=junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl set image deployment/myapp app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -n staging
    - kubectl rollout status deployment/myapp -n staging
  environment:
    name: staging
    url: https://staging.myapp.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
